name: Get Commit Hashes
description: Resolves the latest commit hash of each tweak repo (used as cache keys)

inputs:
  isponsorblock:
    description: Resolve isponsorblock
    required: false
    default: 'false'
  demc:
    description: Resolve demc
    required: false
    default: 'false'
  ytlowcontrastmode:
    description: Resolve ytlowcontrastmode
    required: false
    default: 'false'
  ythold:
    description: Resolve ythold
    required: false
    default: 'false'
  volumeboost:
    description: Resolve volumeboost
    required: false
    default: 'false'
  nativeshare:
    description: Resolve nativeshare
    required: false
    default: 'false'
  pleasedontstopthemusic:
    description: Resolve pleasedontstopthemusic
    required: false
    default: 'false'

outputs:
  youpip:
    description: YouPiP commit hash
    value: ${{ steps.hashes.outputs.youpip }}
  ytuhd:
    description: YTUHD commit hash
    value: ${{ steps.hashes.outputs.ytuhd }}
  ryd:
    description: Return-YouTube-Dislikes commit hash
    value: ${{ steps.hashes.outputs.ryd }}
  ygs:
    description: YouGroupSettings commit hash
    value: ${{ steps.hashes.outputs.ygs }}
  ytvo:
    description: YTVideoOverlay commit hash
    value: ${{ steps.hashes.outputs.ytvo }}
  ytabconfig:
    description: YTABConfig commit hash
    value: ${{ steps.hashes.outputs.ytabconfig }}
  youquality:
    description: YouQuality commit hash
    value: ${{ steps.hashes.outputs.youquality }}
  youspeed:
    description: YouSpeed commit hash
    value: ${{ steps.hashes.outputs.youspeed }}
  youmute:
    description: YouMute commit hash
    value: ${{ steps.hashes.outputs.youmute }}
  youloop:
    description: YouLoop commit hash
    value: ${{ steps.hashes.outputs.youloop }}
  youchoose:
    description: YouChooseQuality commit hash
    value: ${{ steps.hashes.outputs.youchoose }}
  ytweaks:
    description: YTweaks commit hash
    value: ${{ steps.hashes.outputs.ytweaks }}
  yougetcaption:
    description: YouGetCaption commit hash
    value: ${{ steps.hashes.outputs.yougetcaption }}
  iamyoutube:
    description: IAmYouTube commit hash
    value: ${{ steps.hashes.outputs.iamyoutube }}
  isponsorblock:
    description: iSponsorBlock commit hash
    value: ${{ steps.hashes.outputs.isponsorblock }}
  demc:
    description: DontEatMyContent commit hash
    value: ${{ steps.hashes.outputs.demc }}
  ytlowcontrastmode:
    description: YTLowContrastMode commit hash
    value: ${{ steps.hashes.outputs.ytlowcontrastmode }}
  ythold:
    description: YTHoldForSpeed commit hash
    value: ${{ steps.hashes.outputs.ythold }}
  volumeboost:
    description: VolumeBoostYT commit hash
    value: ${{ steps.hashes.outputs.volumeboost }}
  nativeshare:
    description: YTNativeShare commit hash
    value: ${{ steps.hashes.outputs.nativeshare }}
  youfixplaybackissues:
    description: YouFixPlaybackIssues commit hash
    value: ${{ steps.hashes.outputs.youfixplaybackissues }}
  pleasedontstopthemusic:
    description: PleaseDontStopTheMusic commit hash
    value: ${{ steps.hashes.outputs.pleasedontstopthemusic }}

runs:
  using: composite
  steps:
    - name: Fetch commit hashes
      id: hashes
      shell: bash
      env:
        ISPONSORBLOCK: ${{ inputs.isponsorblock }}
        DEMC: ${{ inputs.demc }}
        YTLOWCONTRASTMODE: ${{ inputs.ytlowcontrastmode }}
        YTHOLD: ${{ inputs.ythold }}
        VOLUMEBOOST: ${{ inputs.volumeboost }}
        NATIVESHARE: ${{ inputs.nativeshare }}
        PLEASEDONTSTOPTHEMUSIC: ${{ inputs.pleasedontstopthemusic }}
      run: |
        export GIT_TERMINAL_PROMPT=0

        get_hash() {
          local name="$1" repo="$2" hash="" attempt
          for attempt in 1 2 3; do
            hash="$(git ls-remote "https://github.com/${repo}.git" HEAD 2>/dev/null | awk 'NR==1 {print $1}' || true)"
            if [[ "$hash" =~ ^[0-9a-f]{40,64}$ ]]; then
              break
            fi
            hash=""
            sleep 2
          done
          if [ -z "$hash" ]; then
            echo "::warning title=Commit lookup failed::Could not resolve HEAD of ${repo}; its cache is skipped for this run"
          fi
          echo "${name}=${hash}" >> "$GITHUB_OUTPUT"
        }

        get_hash youpip               PoomSmart/YouPiP
        get_hash ytuhd                Tonwalter888/YTUHD
        get_hash ryd                  PoomSmart/Return-YouTube-Dislikes
        get_hash ygs                  PoomSmart/YouGroupSettings
        get_hash ytvo                 PoomSmart/YTVideoOverlay
        get_hash ytabconfig           PoomSmart/YTABConfig
        get_hash youquality           PoomSmart/YouQuality
        get_hash youspeed             PoomSmart/YouSpeed
        get_hash youmute              PoomSmart/YouMute
        get_hash youloop              bhackel/YouLoop
        get_hash youchoose            PoomSmart/YouChooseQuality
        get_hash ytweaks              fosterbarnes/YTweaks
        get_hash yougetcaption        PoomSmart/YouGetCaption
        get_hash iamyoutube           PoomSmart/IAmYouTube
        get_hash youfixplaybackissues mrdrvt99/YouFixPlaybackIssues

        if [ "$ISPONSORBLOCK" = "true" ]; then
          get_hash isponsorblock Galactic-Dev/iSponsorBlock
        else
          echo "isponsorblock=disabled" >> "$GITHUB_OUTPUT"
        fi

        if [ "$DEMC" = "true" ]; then
          get_hash demc therealFoxster/DontEatMyContent
        else
          echo "demc=disabled" >> "$GITHUB_OUTPUT"
        fi

        if [ "$YTLOWCONTRASTMODE" = "true" ]; then
          get_hash ytlowcontrastmode Mark02-2012/YTLowContrastMode
        else
          echo "ytlowcontrastmode=disabled" >> "$GITHUB_OUTPUT"
        fi

        if [ "$YTHOLD" = "true" ]; then
          get_hash ythold joshuaseltzer/YTHoldForSpeed
        else
          echo "ythold=disabled" >> "$GITHUB_OUTPUT"
        fi

        if [ "$VOLUMEBOOST" = "true" ]; then
          get_hash volumeboost mrdrvt99/VolumeBoostYT
        else
          echo "volumeboost=disabled" >> "$GITHUB_OUTPUT"
        fi

        if [ "$NATIVESHARE" = "true" ]; then
          get_hash nativeshare jkhsjdhjs/youtube-native-share
        else
          echo "nativeshare=disabled" >> "$GITHUB_OUTPUT"
        fi

        if [ "$PLEASEDONTSTOPTHEMUSIC" = "true" ]; then
          get_hash pleasedontstopthemusic mikey820/PleaseDontStopTheMusic
        else
          echo "pleasedontstopthemusic=disabled" >> "$GITHUB_OUTPUT"
        fi
