name: Cache Theos
description: Restores (or creates) the latest Theos checkout together with the iOS SDK

inputs:
  theos_commit:
    description: Theos commit to use (defaults to latest on the master branch)
    required: false
    default: ''
  sdk_version:
    description: iOS SDK version bundled into Theos (part of the cache key)
    required: false
    default: '26.5'

outputs:
  cache-hit:
    description: Whether Theos (including the SDK) was restored from cache
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Set THEOS env
      shell: bash
      run: echo "THEOS=${{ github.workspace }}/theos" >> "$GITHUB_ENV"

    - name: Resolve Theos commit
      id: resolve
      shell: bash
      env:
        INPUT_COMMIT: ${{ inputs.theos_commit }}
      run: |
        if [ -n "$INPUT_COMMIT" ]; then
          sha="$INPUT_COMMIT"
        else
          sha="$(git ls-remote https://github.com/theos/theos.git HEAD | cut -f1)"
        fi
        test -n "$sha"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - name: Restore Theos cache
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/theos
        key: theos-${{ steps.resolve.outputs.sha }}-sdk${{ inputs.sdk_version }}

    - name: Clone Theos
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        THEOS: ${{ github.workspace }}/theos
        THEOS_COMMIT: ${{ steps.resolve.outputs.sha }}
      run: |
        git clone --quiet https://github.com/theos/theos.git "$THEOS"
        cd "$THEOS"
        git checkout --quiet "$THEOS_COMMIT"
        git submodule update --quiet --init --recursive --depth=1

    - name: Download iOS SDK
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        THEOS: ${{ github.workspace }}/theos
        SDK_VERSION: ${{ inputs.sdk_version }}
      run: |
        sdk_repo="$RUNNER_TEMP/iOS-SDKs"
        git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/xybp888/iOS-SDKs.git "$sdk_repo"
        cd "$sdk_repo"
        git sparse-checkout set --no-cone "iPhoneOS${SDK_VERSION}.sdk"
        git checkout
        mkdir -p "$THEOS/sdks"
        mv "iPhoneOS${SDK_VERSION}.sdk" "$THEOS/sdks/"
        test -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"
        rm -rf "$sdk_repo"
